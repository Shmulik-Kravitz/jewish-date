name: CI/CD


on: [push, pull_request]


jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        always-auth: true

    - name: Install
      run: yarn

    - name: Build
      run: yarn build

    - name: Test
      run: yarn test

    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/**/cobertura-coverage.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    # - name: Add Coverage PR Comment
    #   uses: marocchino/sticky-pull-request-comment@v2
    #   if: github.event_name == 'pull_request'
    #   with:
    #     recreate: true
    #     path: code-coverage-results.md

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
       name: lib
       path: lib

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist

  release:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      deployments: write
      id-token: write
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          always-auth: true
      
      - run: npm config list

      - name: Install
        run: yarn
      
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: lib
          path: lib
      
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Increment version
        run: yarn inc-version

      - name: Publish to npm
        run: npm publish --provenance --access public


      # - run: npm install -g npm
      # - run: npm ci
      # - run: npm publish --provenance --access public
      #   env:
      #     NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # - run: yarn npm publish --access public
      #   env:
      #     YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Get version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set the tag to v${{ steps.get_version.outputs.version }}
        run:  git tag -a v${{ steps.get_version.outputs.version }} -m "Version ${{ steps.get_version.outputs.version }}"

      - name: Commit 
        run: |
          git commit -am v${{ steps.get_version.outputs.version }}
          git push
          git push origin v${{ steps.get_version.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          awk -v ver="## $VERSION" '$0 == ver { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "No '## $VERSION' section in CHANGELOG.md - falling back to auto-generated notes."
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
