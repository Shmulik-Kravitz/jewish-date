compressionLevel: mixed

enableGlobalCache: false

nmHoistingLimits: dependencies

nodeLinker: pnpm

npmPublishAccess: public

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"
  vite@*:
    dependencies:
      ms: "*"
      supports-color: "*"

pnpMode: loose

yarnPath: .yarn/releases/yarn-4.17.1.cjs
